<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Élan Fitness" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Square background -->
  <rect width="64" height="64" rx="14" fill="#0F1B2D"/>
  <!-- The letter E made with 4 rectangles -->
  <rect x="20" y="24" width="7" height="28" fill="#FFFFFF"/>
  <rect x="20" y="24" width="24" height="7" fill="#FFFFFF"/>
  <rect x="20" y="34.5" width="18" height="7" fill="#FFFFFF"/>
  <rect x="20" y="45" width="24" height="7" fill="#FFFFFF"/>
  <!-- The orange accent of the letter É -->
  <polygon points="28,17 34,17 42,8 36,8" fill="#FF6B2C"/>
</svg>
